services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: noteboard-dev
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/app
    environment:
      SERVER_NAME: ":80"
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    profiles: ["tools"]
