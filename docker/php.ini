; Mounted into the container at $PHP_INI_DIR/conf.d/zz-swag.ini.
; Edit and restart the container; no image rebuild needed.

; Uploads. Keep these above swag.media.max_kb (25 MB) — the multipart body is
; a little larger than the file itself, so post_max_size needs the headroom.
; If PHP rejects the body, Laravel never sees the file and the user is told
; "No file received. It may be larger than the server allows".
upload_max_filesize = 26M
post_max_size = 28M

; One upload per request, so the default of 20 is plenty.
max_file_uploads = 20
