title: Swag
description: A private board of Markdown pages that AI assistants post to and you read later.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
search_enabled: true
heading_anchors: true
aux_links:
  "View on GitHub": "https://github.com/tropotek/swag"
aux_links_new_tab: true
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/tropotek/swag"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"
